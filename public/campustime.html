<!DOCTYPE html>
<html lang="ko" data-campustime="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>캠퍼스타임</title>
<style>
  :root{
    --red:#E8443C; --red-dim:#FDECEA;
    --ink:#15171B; --sub:#8C939C; --faint:#B9BFC7;
    --line:#EDEFF2; --bg:#F2F3F5; --card:#FFFFFF;
    --r:14px;
    --font:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',
      'Noto Sans KR',system-ui,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#DCDEE2;color:var(--ink);font-family:var(--font);
    -webkit-text-size-adjust:100%}
  body{display:flex;justify-content:center;height:100vh;height:100dvh;overflow:hidden;
    overscroll-behavior:none}
  #shell{width:100%;max-width:480px;height:100%;background:var(--bg);position:relative;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}

  header{position:sticky;top:0;z-index:20;height:52px;flex:0 0 auto;background:var(--card);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 6px 0 12px}
  .h-title{flex:1;min-width:0;font-size:17px;font-weight:800;letter-spacing:-.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand{font-size:19px;font-weight:900;letter-spacing:-.04em;color:var(--red)}
  .brand span{color:var(--ink)}
  .icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
    font-size:19px;color:var(--sub)}
  .icon-btn:active{background:var(--bg)}
  .quiet{color:#D6DAE0;font-size:17px;letter-spacing:2px}
  .h-clock{flex:0 0 auto;text-align:right;padding:0 4px 0 8px;line-height:1.2;
    font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:-.02em;white-space:nowrap}
  .h-clock b{display:block;font-size:12px;font-weight:800;color:var(--ink)}

  main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;padding-bottom:calc(76px + var(--safe-b))}
  .pad{padding:12px}
  .card{background:var(--card);border-radius:var(--r);overflow:hidden}
  .card + .card{margin-top:10px}
  .sec{padding:14px 14px 6px;font-size:12.5px;font-weight:800;color:var(--sub);letter-spacing:-.01em}
  .fold-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
    padding:14px;text-align:left;background:var(--card)}
  .fold-h.on{border-bottom:1px solid var(--line)}
  .fold-t{font-size:13.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink);min-width:0}
  .fold-t small{display:block;font-size:11.5px;font-weight:600;color:var(--faint);margin-top:3px;
    letter-spacing:0;line-height:1.4}
  .fold-c{flex:0 0 auto;color:var(--faint);font-size:15px;line-height:1;width:18px;text-align:center}
  .note{padding:0 14px 14px;font-size:12px;color:var(--faint);line-height:1.6}

  /* 목록 */
  .p-item{display:block;width:100%;text-align:left;background:var(--card);padding:14px;
    border-bottom:1px solid var(--line)}
  .p-item:active{background:#FAFAFB}
  .p-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .avatar{width:22px;height:22px;border-radius:50%;background:var(--bg);display:grid;
    place-items:center;font-size:11px;color:var(--sub);flex:0 0 auto}
  .p-who{font-size:12.5px;font-weight:600;color:#4B5158}
  .p-time{font-size:11.5px;color:var(--faint)}
  .p-main{display:flex;gap:11px;align-items:flex-start}
  .p-txt{flex:1;min-width:0}
  .p-title{font-size:15px;font-weight:700;letter-spacing:-.025em;line-height:1.35;margin-bottom:4px}
  .p-body{font-size:13.5px;color:#5C636B;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .p-thumb{width:58px;height:58px;border-radius:10px;flex:0 0 auto;background:var(--bg);
    display:grid;place-items:center;font-size:17px;color:var(--faint)}
  .p-meta{display:flex;gap:12px;margin-top:9px;font-size:12px;color:var(--faint)}
  .p-meta b{font-weight:600}
  .p-meta .on{color:var(--red)}

  /* 상세 */
  .d-wrap{background:var(--card);padding:16px 14px 14px}
  .d-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .d-head .avatar{width:34px;height:34px;font-size:14px}
  .d-who{font-size:13.5px;font-weight:700}
  .d-sub{font-size:11.5px;color:var(--faint);margin-top:2px}
  .d-title{margin:0 0 8px;font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
  .d-body{font-size:15px;line-height:1.65;white-space:pre-wrap;color:#22262B}
  .shot{margin-top:13px;border-radius:12px;background:var(--bg);border:1px dashed #DDE1E6;
    padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:7px;
    color:var(--sub);font-size:13px;text-align:center;line-height:1.45}
  .shot i{font-style:normal;font-size:20px;opacity:.5}
  .d-actions{display:flex;gap:8px;margin-top:18px}
  .pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:12.5px;color:var(--sub);font-weight:600;background:var(--card)}
  .pill.on{border-color:var(--red);color:var(--red);background:var(--red-dim)}

  .c-head{background:var(--card);padding:12px 14px 4px;font-size:12.5px;font-weight:800;color:var(--sub)}
  .c-item{display:flex;gap:9px;padding:11px 14px;background:var(--card);border-top:1px solid var(--line)}
  .c-item.reply{padding-left:38px;background:#FAFBFC}
  .c-main{flex:1;min-width:0}
  .c-who{font-size:12.5px;font-weight:700}
  .c-who em{font-style:normal;color:var(--red);font-size:10.5px;margin-left:4px}
  .c-text{font-size:14px;line-height:1.5;margin-top:3px;white-space:pre-wrap;word-break:break-word}
  .c-foot{display:flex;gap:12px;margin-top:6px;font-size:11.5px;color:var(--faint)}
  .c-foot button{font-size:11.5px;color:var(--faint);font-weight:600}
  .c-foot button.on{color:var(--red)}

  .typing{display:flex;gap:5px;align-items:center;padding:12px 14px;background:var(--card);
    border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
  .typing b{font-weight:600;margin-left:4px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--faint);animation:blink 1.1s infinite}
  .dot:nth-child(2){animation-delay:.16s}
  .dot:nth-child(3){animation-delay:.32s}
  @keyframes blink{0%,65%,100%{opacity:.25}30%{opacity:1}}

  .choices{background:var(--card);border-top:1px solid var(--line);padding:13px 14px 5px}
  .choices .lbl{font-size:11.5px;font-weight:800;color:var(--faint);margin-bottom:9px}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;font-size:13.5px;line-height:1.45;margin-bottom:8px;background:#fff}
  .choice:active{background:var(--red-dim);border-color:var(--red)}

  .composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:var(--card);
    border-top:1px solid var(--line);padding:9px 12px calc(9px + var(--safe-b))}
  .composer input{flex:1;min-width:0;border:none;background:var(--bg);border-radius:999px;
    padding:11px 14px;outline:none;font-size:16px}
  .send{color:var(--red);font-weight:800;font-size:14px;padding:6px}

  /* 설정 */
  .row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:none}
  .row .k{flex:1;min-width:0;font-size:14px}
  .row .k small{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.45}
  .sv{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--red);min-width:52px;text-align:right}
  .sld{padding:2px 14px 16px}
  .sld input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;
    background:none;outline:none;margin:0;display:block}
  .sld input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
  .sld input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
  .sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--red);
    margin-top:-9px;box-shadow:0 2px 6px rgba(0,0,0,.14);cursor:pointer}
  .sld input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;
    border:2px solid var(--red);box-shadow:0 2px 6px rgba(0,0,0,.14);cursor:pointer}
  .sld input[type=range]:active::-webkit-slider-thumb{background:var(--red-dim)}
  .sld .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:-2px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 14px}
  .seg button{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;
    color:var(--sub);font-weight:600;background:#fff}
  .seg button.on{border-color:var(--red);color:var(--red);background:var(--red-dim)}
  .ta{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:11px;
    font-size:16px;line-height:1.5;outline:none;resize:vertical;background:#fff;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ta:focus{border-color:var(--red)}
  .btn{display:block;width:100%;background:var(--red);color:#fff;border-radius:12px;padding:13px;
    font-size:14.5px;font-weight:800;margin-top:9px}
  .btn.sub{background:var(--bg);color:var(--ink)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid var(--red)}
  .fld{padding:0 14px 14px}
  .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin:0 0 6px}
  .fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    outline:none;background:#fff;font-size:16px}
  .src-item{display:flex;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:center}
  .src-item .n{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .src-item .c{font-size:11.5px;color:var(--faint);flex-shrink:0}
  .tl-row{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-bottom:1px solid var(--line);background:none;text-align:left}
  .tl-row.on{background:var(--chip)}
  .tl-row .tt{flex:1;font-size:13.5px;font-weight:750}
  .tl-row .st{font-size:11px;color:var(--faint);flex-shrink:0}
  .tl-row.on .st{color:var(--accent);font-weight:700}
  .tl-row .x{border:0;background:none;color:var(--faint);font-size:16px;padding:0 4px}

  .pp{border-top:1px solid var(--line);background:var(--card)}
  .pp-av{width:44px;height:44px;border-radius:13px;background:var(--red-dim);color:var(--red);
    display:grid;place-items:center;font-size:16px;font-weight:800;flex:0 0 auto;overflow:hidden}
  .pp-av img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-box{display:flex;align-items:center;gap:12px;padding:0 0 13px}
  .ph-prev{width:66px;height:66px;border-radius:18px;background:var(--bg);flex:0 0 auto;
    display:grid;place-items:center;overflow:hidden;color:var(--faint);font-size:20px;
    border:1px solid var(--line)}
  .ph-prev img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-btns{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .ph-btns button{border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;
    font-weight:600;color:var(--sub);background:#fff}
  .ph-btns button:active{border-color:var(--red);color:var(--red)}
  .pp-b{flex:1;min-width:0}
  .pp-n{font-size:14.5px;font-weight:700;letter-spacing:-.02em;display:block}
  .pp-n em{font-style:normal;font-size:11px;font-weight:700;color:var(--red);background:var(--red-dim);
    border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:1px}
  .pp-d{display:block;font-size:12.5px;color:#5C636B;margin-top:4px;line-height:1.45}
  .pp-m{display:block;font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.45}
  .pp-m b{font-weight:700;color:#A6ADB6}
  .rank{width:22px;flex:0 0 auto;font-size:13px;font-weight:800;color:var(--faint);
    text-align:center;padding-top:1px}
  .rank.top{color:var(--red)}
  .hot-row{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);
    padding:13px 14px;border-bottom:1px solid var(--line)}
  .hot-row:active{background:#FAFAFB}
  .hot-b{flex:1;min-width:0}
  .hot-t{font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hot-m{font-size:11.5px;color:var(--faint);margin-top:5px}
  .mrow{display:block;width:100%;text-align:left;background:var(--card);padding:13px 14px;
    border-bottom:1px solid var(--line)}
  .mrow:active{background:#FAFAFB}
  .mrow .src{font-size:11.5px;color:var(--faint);margin-bottom:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .txt{font-size:14px;line-height:1.5;color:#22262B}
  .mrow .tm{font-size:11.5px;color:var(--faint);margin-top:6px}
  .more-btn{display:block;width:100%;padding:12px;text-align:center;font-size:12.5px;
    color:var(--sub);font-weight:600;border-top:1px solid var(--line)}
  .gate{padding:8px 0 4px}
  .gate-btn{display:block;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:12px}
  .gate-btn:active{border-color:var(--red);background:var(--red-dim)}
  .gate-k{font-size:17px;font-weight:800;letter-spacing:-.03em}
  .gate-d{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5}
  .mk-item{display:block;width:100%;text-align:left;background:var(--card);padding:12px 14px;
    border-bottom:1px solid var(--line)}
  .mk-item:active{background:#FAFAFB}
  .mk-row{display:flex;gap:12px;align-items:flex-start}
  .mk-row-b{flex:1;min-width:0}
  .mk-name{font-size:14.5px;font-weight:700;letter-spacing:-.025em;line-height:1.35}
  .mk-own{font-size:12px;color:var(--sub);margin-top:4px}
  .mk-price{font-size:15px;font-weight:800;margin-top:6px;color:var(--red)}
  .mk-chg{font-size:12px;font-weight:700;margin-top:3px}
  .mk-chg.up{color:var(--red)}
  .mk-chg.dn{color:#3B7DD8}
  .mk-chg.z{color:var(--faint)}
  .mk-trade{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .mk-trade .fld{padding:0 0 12px}
  .mk-wait{font-size:13.5px;color:var(--sub);line-height:1.6;padding:4px 0 8px}
  .mk-hint{font-size:12px;color:var(--faint);line-height:1.55;margin-top:10px}
  .mk-desc{font-size:13px;color:#5C636B;line-height:1.5;margin-top:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mk-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .mk-tag{font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);
    border:1px solid var(--line);border-radius:6px;padding:3px 7px}
  .mk-th{height:108px;display:grid;place-items:center;font-size:13px;font-weight:800;
    letter-spacing:-.02em;color:#6B7280}
  .mk-th.sm{width:64px;height:64px;border-radius:10px;flex:0 0 auto;font-size:11px}
  .mk-th.k0{background:#F6EBE4;color:#A05A3C}
  .mk-th.k1{background:#E7EDF6;color:#3D5A80}
  .mk-th.k2{background:#E4F0EA;color:#2F6B52}
  .mk-th.k3{background:#F3F0E6;color:#7A6A3A}
  .mk-th.k4{background:#F3E8F0;color:#8A4A72}
  .mk-th.k5{background:#E8F2F4;color:#2F6A78}
  .mk-th.k6{background:#EEEAE4;color:#6A5848}
  .mk-th.k7{background:#EEF0F3;color:#5B6570}
  .mk-cats{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);
    border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .mk-cat{flex:0 0 auto;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;
    background:var(--bg);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
  .mk-cat.on{background:var(--red-dim);color:var(--red);border-color:transparent}
  .mk-cat small{font-weight:700;color:inherit;opacity:.7;margin-left:4px}
  .rarity{display:inline-block;font-size:10px;font-weight:800;border-radius:5px;
    padding:2px 6px;margin-right:6px;vertical-align:2px}
  .r-rare{color:#8A4B00;background:#FFE7C2}
  .r-mid{color:#3D5CCC;background:#DCE4FF}
  .r-common{color:#5B6570;background:#E7ECF0}
  .r2{color:var(--red);background:var(--red-dim)}
  .cr-bar{display:flex;justify-content:space-between;align-items:center;
    background:var(--card);padding:12px 14px;border-bottom:1px solid var(--line)}
  .cr-bar .k{font-size:12.5px;color:var(--sub);font-weight:700}
  .cr-bar .v{font-size:16px;font-weight:800}
  .ach-row{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
  .ach-row:first-of-type{border-top:none}
  .ach-row.off{opacity:.5}
  .ach-n{font-size:14px;font-weight:700;letter-spacing:-.02em}
  .ach-h{display:block;font-size:12px;color:var(--faint);margin-top:3px;line-height:1.4}
  .tier{flex:0 0 auto;font-size:10px;font-weight:800;padding:3px 6px;border-radius:5px;margin-top:1px}
  .t0{color:#8B5A2B;background:#F3E4D1}
  .t1{color:#5B6570;background:#E7ECF0}
  .t2{color:#9A7B12;background:#F7E7A8}
  .t3{color:#2F7A7A;background:#D7EFEF}
  .t4{color:#3D5CCC;background:#DCE4FF}
  .t5{color:#A13D7A;background:#F5D5E8}
  .t6{color:#C44738;background:#F8D4CE}
  .t7{color:#8A6A00;background:#FFE58A}
  .ach-pop{text-align:center;padding-top:6px}
  .ach-pop .tier{display:inline-block;margin:0 0 12px}
  /* 투표 */
  .vbadge{display:inline-block;font-size:10px;font-weight:800;color:var(--red);background:var(--red-dim);
    border-radius:5px;padding:2px 6px;margin-right:6px;vertical-align:2px}
  .poll{margin-top:15px;display:flex;flex-direction:column;gap:8px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;font-size:14.5px;font-weight:600;background:#fff;position:relative;overflow:hidden}
  .opt:active{border-color:var(--red)}
  .opt.done{cursor:default}
  .opt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--bg);z-index:0;
    transition:width .5s cubic-bezier(.2,.8,.3,1)}
  .opt.mine .bar{background:var(--red-dim)}
  .opt .lb{position:relative;z-index:1;display:flex;align-items:center;gap:8px}
  .opt .lb span{flex:1;min-width:0}
  .opt .pc{font-size:13px;font-weight:800;color:var(--sub);flex:0 0 auto}
  .opt.mine .pc{color:var(--red)}
  .opt .chk{font-size:11px;color:var(--red);font-weight:800;flex:0 0 auto}
  .poll-sum{font-size:12px;color:var(--faint);margin-top:9px}

게시글 규칙:
- date — 글이 올라온 날짜. "YYYY-MM-DD". 지시된 그날 그대로.
- time — 캠퍼스 게시판에 올라온 시각. "HH:MM" 24시간제. 지시된 시간 구간 안에만. 구간 밖은 넣지 마라.
  글마다 시각을 다르게 흩어라.
- comments[].writer — 글쓴이 본인의 댓글이면 true.
- comments[].reply — 몇 번째 댓글(0부터)에 대댓글로 달지. 없는 번호를 쓰지 마라.
- choices — 글마다 3~4개. 읽는 사람이 버튼으로 고를 댓글이다.
- choices[].replies — 그 선택지를 골랐을 때만 달리는 답글. 1~2개.
- likes, scraps — 글은 20~250, 댓글은 0~30 사이에서 자연스럽게. 인기 없는 글도 섞어라.{사진규칙}
- 한국 대학생이 실제로 쓰는 말투. 문장 짧게. 맞춤법이 조금 흐트러져도 된다.
- choices 3~4개는 입장이 서로 달라야 한다. 동조 / 반대 / 질문 / 경험 공유로 방향을 나눠라.
- replies는 그 선택지에만 어울리는 반응이어야 한다.
- 제목은 낚시성으로 쓰지 말고 실제 게시판 제목처럼 담백하게.
- 글마다 온도를 다르게. 하소연, 정보 공유, 사소한 질문, 자랑, 시비조를 섞어라.
- 게시판은 하나뿐이니 분류하지 말고 한 줄기로 써라.

투표 규칙:
- time은 게시글과 같다. 지시된 구간 안에만.
- options는 2개를 기본으로. 3~4개는 정말 필요할 때만. 문구는 12자를 넘기지 마라.
- votes는 초기 득표. 30~500 사이에서 한쪽으로 기울게. 반반은 재미없다.
- title은 "A vs B" 형태거나 질문형. body는 조건을 한 줄로.
- comments 1~3개, choices 3~4개, replies 1~2개.
- 둘 다 그럴듯한 양자택일. 명백한 정답 금지.

물품 규칙:
- time은 게시글과 같다. 지시된 구간 안에만.
- 게시판에 [거래] 말머리로 올라가는 글이다. 제목은 반드시 "[거래] "로 시작해라.
- owner — 아래 인물 목록에 있는 이름을 그대로. 목록에 없는 인물을 지어내지 마라. 골고루 배정해라.
- name — 물건 이름. 누구 물건인지 드러나게. price 500~5000. 이 값이 기준가다.
- traits — 문자열 2~4개. 종류와 기운을 섞어 여러 개.
  종류: 옷 / 교재 / 전자기기 / 생활 / 취향 / 문구 / 가구
  기운: 천박함 / 허세 / 애잔함 / 진지함 / 귀여움 / 낡음 / 고급짐 / 민망함 / 과함 / 쓸쓸함
  목록 밖 단어 금지. 한 묶음에서 특성이 겹치지 않게.
- body — 한두 문장. 특성 단어를 문장에 그대로 박지 마라.
- comments·choices — 게시글과 같은 형식.

공통:
- 이모지 금지. 느낌표는 항목 하나에 최대 하나.
- 실존 인물·학교·기업·브랜드 실명 금지. 학교는 "우리 학교", 건물은 "인문관 302"처럼.
- 정치·종교·집단 비하, 성적인 내용, 개인 특정 정보 금지.
- 댓글은 서로 다른 사람이 쓴 것처럼 말투와 길이를 다르게 하라.{떡밥규칙}{인물}

let idb=null, saveT=null, saveWarned=false;
function openIDB(){
  return new Promise(res=>{
    if(!window.indexedDB) return res(null);
    let r; try{ r=indexedDB.open('campustime',1); }catch(e){ return res(null); }
    r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>res(null);
    r.onblocked=()=>res(null);
    setTimeout(()=>res(null),3000);
  });
}
function idbGet(k){
  return new Promise(res=>{
    if(!idb) return res(null);
    try{ const q=idb.transaction('kv','readonly').objectStore('kv').get(k);
      q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null);
    }catch(e){ res(null); }
  });
}
function idbSet(k,v){
  return new Promise(res=>{
    if(!idb) return res(false);
    try{ const tx=idb.transaction('kv','readwrite');
      tx.objectStore('kv').put(v,k);
      tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); tx.onabort=()=>res(false);
    }catch(e){ res(false); }
  });
}

function imgOf(f){
  const v=f.image||f.images;
  const t=Array.isArray(v)?v[0]:v;
  if(!t) return '';
  return String(typeof t==='object'?(t.alt||t.src||''):t).trim().slice(0,60);
}
function srcOf(p){
  if(p&&p.src) return p.src;
  if(!p||p.fi<0) return null;
  return (p.pk==='poll'?DB.polls:DB.feed)[p.fi]||null;
}
function stampOf(f, fallback){
  if(!f) return fallback;
  const ts=String(f.time||f.uploaded||'');
  const ds=String(f.date||'');
  let h=null, m=0;
  const a=ts.match(/(\d{1,2})\s*:\s*(\d{2})/) || ds.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(a){ h=+a[1]; m=+a[2]; }
  else {
    const b=ts.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);
    if(b){ h=+b[1]; m=+(b[2]||0); }
  }
  if(h==null || h>23 || m>59) return fallback;
  if(/오후|밤/.test(ts) && h>0 && h<12) h+=12;
  if(/오전|새벽/.test(ts) && h===12) h=0;
  let y, mo, d;
  const ymd=(ds+' '+ts).match(/(\d{4})\s*[-\/.년]\s*(\d{1,2})\s*[-\/.월]\s*(\d{1,2})/);
  if(ymd){ y=+ymd[1]; mo=+ymd[2]; d=+ymd[3]; }
  else {
    const w=worldDate();
    y=w.getFullYear(); mo=w.getMonth()+1; d=w.getDate();
  }
  const at=new Date(y, mo-1, d, h, m, 0).getTime()-WORLD0;
  if(!isFinite(at)) return fallback;
  return at;
}
function dueOf(f){
  const t=stampOf(f, null);
  return typeof t==='number'?t:null;
}
function fillStamp(f){
  if(!f||typeof f!=='object') return f;
  if(!f.date){
    const t=hourBand();
    f.date=t.y+'-'+String(t.m).padStart(2,'0')+'-'+String(t.d).padStart(2,'0');
  }
  return f;
}
function sortWait(list, revealed){
  const pub=(list||[]).slice(0, revealed);
  const wait=(list||[]).slice(revealed);
  wait.sort((a,b)=>{
    const da=dueOf(a), db=dueOf(b);
    const xa=da==null?Infinity:da, xb=db==null?Infinity:db;
    return xa-xb;
  });
  return pub.concat(wait);
}
function nextDue(f){
  const sched=dueOf(f);
  return sched==null?DB.clock:sched;
}
function spawnPost(f,due,poll,fi){
  const trade=!!(f&&(f.trade||f.mid)&&!poll);
  const o={id:uid(), title:String(f.title||'(제목 없음)'), body:String(f.body||''),
    at:stampOf(f,due), likes:+f.likes||0, liked:false, scraps:+f.scraps||0, scrapped:false,
    anon:f.anon!==false, author:null, image:imgOf(f), comments:[],
    fi:fi==null?-1:fi, pk:poll?'poll':(trade?'trade':'feed'), cn:0, cAt:due, cmap:[], used:[], myNo:0};
  if(f.arc) o.arc=String(f.arc).slice(0,40);
  if(trade){ o.mid=f.mid; o.title=tradeTitle(f); }
  if(fi==null||fi<0) o.src=f;
  if(poll){
    const opts=(f.options||[]).map(x=>String(x)).slice(0,4);
    o.options=opts.length>=2?opts:['A','B'];
    o.votes=o.options.map((_,k)=>{
      const v=Array.isArray(f.votes)?+f.votes[k]:NaN;
      return isFinite(v)&&v>=0?Math.round(v):Math.floor(40+Math.random()*260);
    });

  DB.posts.unshift(o);

function publishPost(i,due,poll){

  spawnPost(f,due,poll,i);

function srcClone(p){
  const f=srcOf(p);
  let o;
  try{ o=f?JSON.parse(JSON.stringify(f)):null; }catch(e){ o=null; }
  if(!o) o={title:p.title, body:p.body, comments:[], choices:[]};
  o.pk=p.pk==='poll'?'poll':(p.pk==='trade'?'trade':'feed');
  if(p.pk==='poll'){
    if(!Array.isArray(o.options)) o.options=(p.options||[]).slice();
    if(!Array.isArray(o.votes)) o.votes=(p.votes||[]).slice();
  }
  if(p.pk==='trade'){ o.trade=1; o.mid=p.mid; }
  return o;
}

/* cmap: 원본 댓글 index → 실제 댓글 id.
   내 댓글이 중간에 끼어도 reply/to 대상이 어긋나지 않는다. */
function topOf(p,id){                       // 대댓글에 달린 대댓글은 원 댓글로 올린다
  let c=p.comments.find(x=>x.id===id), guard=0;
  while(c&&c.parent&&guard++<10){
    const up=p.comments.find(x=>x.id===c.parent);
    if(!up) break;
    c=up;
  }
  return c?c.id:null;
}
function publishComment(p,c,due){
  const id=uid();
  const no=c.writer?0:nextNo(p);
  const parent=(c.reply!=null && p.cmap[c.reply])?topOf(p,p.cmap[c.reply]):null;
  p.comments.push({id,by:c.writer?'w':'a',no,text:String(c.text||''),at:due,
    likes:+c.likes||0,liked:false,parent});
  p.cmap[p.cn]=id;
}
function nextNo(p){
  const used=p.comments.filter(c=>c.by!=='w').map(c=>c.no);
  return used.length?Math.max.apply(null,used)+1:1;
}
function busy(){                        // 입력 중이거나 설정/시트를 다루는 중이면 다시 그리지 않는다

}

function tick(){
  if(!DB) return;
  if(!S.playing){ DB.lastTick=Date.now(); return; }
  const now=Date.now();
  DB.clock+=Math.max(0, now-(DB.lastTick||now))*timeScale();
  DB.lastTick=now;
  let ch=false, posted=false;
  while(vaultWait(false)>0){
    const due=nextDue((DB.vault||[])[DB.vrev||0]);
    if(due>DB.clock) break;
    publishVault(false); DB.lastPostAt=due; ch=true; posted=true;
  }
  while(DB.revealed<DB.feed.length){
    const due=nextDue(DB.feed[DB.revealed]);
    if(due>DB.clock) break;
    publishPost(DB.revealed,due,false); DB.lastPostAt=due; DB.revealed++; ch=true; posted=true;
  }
  while(vaultWait(true)>0){
    const due=nextDue((DB.pvault||[])[DB.pvrev||0]);
    if(due>DB.clock) break;
    publishVault(true); DB.plastAt=due; ch=true; posted=true;
  }
  while(DB.prevealed<DB.polls.length){
    const due=nextDue(DB.polls[DB.prevealed]);
    if(due>DB.clock) break;
    publishPost(DB.prevealed,due,true); DB.plastAt=due; DB.prevealed++; ch=true; posted=true;
  }
  const cgap=dripCGap();
  DB.posts.forEach(p=>{
    const f=srcOf(p); if(!f) return;
    const cs=f.comments||[];
    while(p.cn<cs.length){
      const due=Math.max(p.cAt+cgap, DB.clock-cgap);
      if(due>DB.clock) break;
      publishComment(p,cs[p.cn],due); p.cAt=due; p.cn++; ch=true;
    }
  });
  (DB.listed||[]).forEach(id=>{
    const it=marketOf(id); if(!it||!it.rx) return;
    while((it.rxn||0)<it.rx.length){
      const due=Math.max((it.rxAt||0)+cgap, DB.clock-cgap);
      if(due>DB.clock) break;
      it.rxn=(it.rxn||0)+1; it.rxAt=due; ch=true;
    }
  });
  if(posted) refreshQuotes();
  if(settleOrders()) ch=true;
  save();
  if(ch) redraw();
  checkAchs();
}
function pulse(){
  if(!DB||!S.playing) return;
  const now=Date.now(); let ch=false;
  if(DB.pending&&DB.pending.length){
    DB.pending=DB.pending.filter(q=>{
      if(q.due>now) return true;
      const p=postOf(q.pid); if(!p) return false;
      p.comments.push({id:uid(),by:q.writer?'w':'a',no:q.writer?0:nextNo(p),
        text:q.text,at:DB.clock,likes:q.likes||0,liked:false,parent:q.parent?topOf(p,q.parent):null});
      ch=true; return false;
    });
  }
  if(settleOrders()) ch=true;
  if(cycleMarket()) ch=true;
  if(ch){ save(); redraw(); }
  bumpClockUI();
  checkAchs();
}

  wheelAt=now;
  if(e.deltaY>0&&atBottom()){
    wheelAcc+=e.deltaY; setRing('pullRing',wheelAcc/160);
    if(wheelAcc>160){ wheelAcc=0; pullLoad(); } else setPull('조금 더 내리세요',true);
  }else if(e.deltaY<0&&atTop()){
    wheelAcc+=-e.deltaY; setRing('ptrRing',wheelAcc/160);
    setPtr(Math.min(58,wheelAcc*0.35),wheelAcc>160?'놓으면 새로고침':'당겨서 새로고침',wheelAcc>160);
    if(wheelAcc>160){ wheelAcc=0; pullLoad(); }
  }
},{passive:true});

/* ===================== 데이터 불러오기 (누적) ===================== */

function matchJson(t,start){
  let depth=0, inStr=false, esc=false;
  for(let i=start;i<t.length;i++){
    const c=t[i];
    if(inStr){
      if(esc){ esc=false; continue; }
      if(c==='\\'){ esc=true; continue; }
      if(c==='"') inStr=false;
      continue;
    }
    if(c==='"'){ inStr=true; continue; }
    if(c==='{'||c==='[') depth++;
    else if(c==='}'||c===']'){
      depth--;
      if(depth===0) return i;
    }
  }
  return -1;
}
function takeBlock(slice){
  try{ return JSON.parse(slice); }catch(e){}
  try{ const r=new Function('return '+slice)(); if(r!=null) return r; }catch(e2){}
  return null;
}
function jsonBlocks(text){
  const t=String(text);
  const out=[];
  for(let i=0;i<t.length;i++){
    if(t[i]!=='{'&&t[i]!=='[') continue;
    const end=matchJson(t,i);
    if(end<0) continue;
    const v=takeBlock(t.slice(i,end+1));
    if(v!=null && (Array.isArray(v)||typeof v==='object')){ out.push(v); i=end; }
  }
  return out;
}
function mergeBlocks(blocks){
  const posts=[], polls=[], people=[], market=[];
  const pushItem=x=>{
    if(!x||typeof x!=='object') return;
    if(isMarketRow(x)) market.push(x);
    else if(Array.isArray(x.options)&&x.options.length>=2) polls.push(x);
    else if(x.title) posts.push(x);
    else if(x.name&&(x.role||x.memo)) people.push(x);
  };
  blocks.forEach(b=>{
    if(Array.isArray(b)) b.forEach(pushItem);
    else if(b&&typeof b==='object'){
      if(Array.isArray(b.people)) people.push.apply(people, b.people);
      if(Array.isArray(b.market)) market.push.apply(market, b.market);
      ;[].concat(b.posts||[], b.feed||[], b.polls||[]).forEach(pushItem);
    }
  });
  if(people.length||market.length||polls.length)
    return {people, market, posts:posts.concat(polls)};
  return posts;
}
function extract(text){
  let t=String(text).replace(/```[a-zA-Z]*/g,'').trim();
  if(t.indexOf('window.FEED')>=0){
    try{ const w={}; const r=new Function('window', t+'\nreturn window.FEED;')(w); if(Array.isArray(r)) return r; }catch(e){}
  }
  const blocks=jsonBlocks(t);
  if(!blocks.length) throw new Error('JSON 배열을 찾지 못했습니다');
  if(blocks.length===1) return blocks[0];
  return mergeBlocks(blocks);
}
function addFeed(text,name){
  let data;
  try{ data=extract(text); }
  catch(e){ return toast('불러오기 실패: '+e.message); }
  let added=0, madded=0;
  if(data&&!Array.isArray(data)){
    if(Array.isArray(data.people)){
    data.people.forEach(pr=>{
      if(!pr||!pr.name) return;
      if(DB.people.some(x=>x.name===pr.name)) return;
      const o={id:uid(),name:String(pr.name),role:String(pr.role||'기타')};
      ['age','build','shape','desc','memo','photo'].forEach(k=>{ if(pr[k]) o[k]=String(pr[k]); });
      DB.people.push(o);
      added++;
    });
    }
    if(Array.isArray(data.market)) madded+=mergeMarket(data.market);
    data=[].concat(data.posts||[], data.feed||[], data.polls||[]);
  }
  if(!Array.isArray(data)) data=[];
  const fromArr=data.filter(isMarketRow);
  if(fromArr.length) madded+=mergeMarket(fromArr);
  data=data.filter(f=>!isMarketRow(f));
  const items=data.filter(f=>f&&typeof f==='object'&&f.title);
  if(!items.length){
    if(added||madded){
      if(madded) refreshQuotes();
      save(); tick(); render();
      return toast([added?`인물 ${added}명`:'', madded?`물품 ${madded}개`:''].filter(Boolean).join(' · ')+' 추가');
    }
    return toast('title이 있는 글이 하나도 없습니다');
  }
  items.forEach(f=>{
    fillStamp(f);
    delete f.after;
    (f.comments||[]).forEach(c=>{ delete c.after; if(c.reply!=null&&!(f.comments||[])[c.reply]) delete c.reply; });
    (f.choices||[]).forEach(c=>{
      if(c.to!=null&&!(f.comments||[])[c.to]) delete c.to;
      (c.replies||[]).forEach(r=>{ delete r.after; });
    });
  });
  const polls=items.filter(f=>Array.isArray(f.options)&&f.options.length>=2);
  const posts=items.filter(f=>!(Array.isArray(f.options)&&f.options.length>=2));
  const known=new Set([].concat(DB.feed||[], DB.posts||[], DB.polls||[]).map(x=>x&&x.title).filter(Boolean));
  const skipP=posts.filter(f=>known.has(f.title)).length;
  const skipQ=polls.filter(f=>known.has(f.title)).length;
  const newPosts=posts.filter(f=>!known.has(f.title));
  const newPolls=polls.filter(f=>!known.has(f.title));
  if(newPosts.length){
    const drained=DB.revealed>=DB.feed.length;
    DB.feed=sortWait(DB.feed.concat(newPosts), DB.revealed);
    if(drained) DB.lastPostAt=DB.clock;
  }
  if(newPolls.length){
    const pdrained=DB.prevealed>=DB.polls.length;
    DB.polls=sortWait(DB.polls.concat(newPolls), DB.prevealed);
    if(pdrained) DB.plastAt=DB.clock;
  }
  const got=newPosts.length+newPolls.length+madded+added;
  if(!got){
    return toast((skipP+skipQ)?'이미 있는 글입니다. 새 것만 가져옵니다':'title이 있는 글이 하나도 없습니다');
  }
  DB.sources.push({name:(name||'붙여넣기')+(newPolls.length&&!newPosts.length?' (투표)':madded?' (물품)':''),
    count:newPosts.length+newPolls.length+madded});
  if(madded) refreshQuotes();
  markTlFromItems([].concat(newPosts, newPolls));
  save(); tick(); render();
  const skip=skipP+skipQ;
  toast([newPosts.length?`글 ${newPosts.length}개`:'',newPolls.length?`투표 ${newPolls.length}개`:'',
    added?`인물 ${added}명`:'',madded?`물품 ${madded}개`:''].filter(Boolean).join(' · ')+' 추가'
    +(skip?` · 중복 ${skip}개 건너뜀`:''));
}

const KIND=['옷','교재','전자기기','생활','취향','문구','가구'];
const VIBE=['천박함','허세','애잔함','진지함','귀여움','낡음','고급짐','민망함','과함','쓸쓸함'];
function normTraits(a){
  if(!Array.isArray(a)) return [];
  const t=[];
  a.forEach(x=>{
    const s=String(x).trim().slice(0,12);
    if(!s || t.indexOf(s)>=0) return;
    t.push(s);
  });
  return t.slice(0,6);
}
function rxPool(it){
  const from=x=>{
    if(typeof x==='string') return x.trim();
    if(x&&typeof x==='object'&&x.text) return String(x.text).trim();
    return '';
  };
  const raw=it.comments||it.reactions;
  if(Array.isArray(raw)) return raw.map(from).filter(Boolean);
  if(raw&&typeof raw==='object')
    return [].concat(raw.up||[], raw.mid||[], raw.down||[]).map(from).filter(Boolean);
  return [];
}

function enqueueTrades(items){

  (items||[]).forEach(it=>{

function isMarketRow(f){

function packMarket(it){
  let id=uid();
  while((DB.market||[]).some(x=>x.id===id)) id=uid();
  const name=String(it.name||it.title||'').replace(/^\[거래\]\s*/,'');

    }

  if(it.time) o.time=it.time;

}
function mergeMarket(arr){
  let n=0; const packed=[];
  (arr||[]).forEach(it=>{
    if(!it||!(it.name||it.title)) return;
    const nm=String(it.name||it.title||'').replace(/^\[거래\]\s*/,'');
    if(DB.market.some(x=>x.name===nm||x.name===it.name)) return;
    const o=packMarket(it);
    DB.market.push(o);
    packed.push(o);
    n++;
  });
  enqueueTrades(packed);
  return n;
}
function won(n){ return Math.round(+n||0).toLocaleString('ko-KR'); }
function marketOf(id){ return (DB.market||[]).find(x=>String(x.id)===String(id)); }
function quoteOf(it){ return Math.max(1, +(it&&it.price)||1); }
function refreshQuotes(){

}
function ownedOf(mid){ return (DB.owned||[]).find(x=>x.mid===mid); }
function orderOf(mid){ return (DB.morders||[]).find(x=>x.mid===mid); }
function onShelf(mid){ return (DB.listed||[]).indexOf(mid)>=0; }
function floorOf(it){ return Math.max(1, Math.round((+it.price||1)*cfgNum('mLo',MKT_FLOOR))); }
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function startListing(it){ /* 거래 글 댓글은 게시글 큐를 쓴다 */ }
function cycleMarket(){
  if(!DB||!DB.market) return false;
  const blocked=id=>!!ownedOf(id)||!!orderOf(id);
  const live=new Set();
  (DB.posts||[]).forEach(p=>{
    if(!isTrade(p)||p.mid==null) return;
    const it=marketOf(p.mid);
    if(it&&!it.down&&!blocked(it.id)) live.add(String(it.id));
  });
  const keep=[];
  live.forEach(id=>{
    const it=marketOf(id);
    if(it) keep.push(it.id);
  });
  const prev=(DB.listed||[]).map(String).join(',');
  const next=keep.map(String).join(',');
  DB.listed=keep;
  return prev!==next;
}
function fillWait(side,price,quote){
  const q=Math.max(1,+quote||1), p=Math.max(1,+price||1);
  const fav=side==='buy'?p/q:q/p;
  const mul=Math.max(0.1, cfgNum('mFill',1));
  if(fav>=1.20) return 90*1000*mul;
  if(fav>=0.80) return 6*MIN*mul;
  if(fav>=0.50) return 35*MIN*mul;
  return 72*HOUR*mul;
}
function waitLabel(ms){
  if(ms<=0) return '즉시';
  if(ms>=24*HOUR) return '사실상 안 잡힘';
  if(ms<MIN) return Math.max(1,Math.round(ms/1000))+'초';
  if(ms<HOUR) return '최대 '+Math.round(ms/MIN)+'분';
  return '최대 '+Math.round(ms/HOUR)+'시간';
}
function leftLabel(due){
  const ms=+due-Date.now();
  if(!(ms>0)) return '곧 체결';
  if(ms<MIN) return Math.max(1,Math.round(ms/1000))+'초 남음';
  if(ms<HOUR) return Math.round(ms/MIN)+'분 남음';
  return Math.round(ms/HOUR)+'시간 남음';
}
function isBroke(){
  return (DB.credit||0)<2000 && !(DB.owned||[]).length
    && !(DB.morders||[]).some(o=>o.side==='buy');
}
function creditGain(n){
  DB.credit=(DB.credit||0)+Math.round(n*cfgNum('mCred',1)*(isBroke()?4:1));
}
function payOnce(p,key,n){
  if(!p||p[key]) return;
  p[key]=1;

function parseMkPrice(q){
  const el=$('#mkPrice');
  const raw=el?el.value:(S.mkPrice||'');
  const n=parseInt(String(raw).replace(/[^\d]/g,''),10);
  if(n>0) return n;
  return Math.max(1, +q||1);
}
function settleOrders(){
  if(!DB||!(DB.morders||[]).length) return false;
  const now=Date.now();
  let ch=false;
  DB.morders=DB.morders.filter(o=>{
    if(+o.due>now) return true;
    fillOrder(o); ch=true; return false;
  });
  if(ch) cycleMarket();
  return ch;
}
function fillOrder(o){
  const it=marketOf(o.mid);
  const name=it?it.name:'물품';
  if(o.side==='buy'){
    DB.owned.push({mid:o.mid, cost:o.price, at:DB.clock});
    DB.trades=(DB.trades||0)+1;
    bump('buy');
    if(it){
      (it.traits||[]).forEach(t=>bump('tr:'+t));
      if((it.traits||[]).length>=3) bump('traits3');
      if((+it.price||0)<=600) bump('cheap');
      if((+it.price||0)>=3000) bump('pricey');
    }
    if(o.fromBroke) bump('frombroke');
    toast(name+' · '+won(o.price)+'에 샀습니다');
  }else{
    DB.credit=(DB.credit||0)+o.price;
    DB.trades=(DB.trades||0)+1;
    bump('sell');
    if(o.cost>0){
      const roi=(o.price-o.cost)/o.cost;
      if(roi>(DB.bestRoi||0)) DB.bestRoi=roi;
      if(o.price<o.cost) bump('loss');
      if(o.price>o.cost) bump('gain');
    }
    toast(name+' · '+won(o.price)+'에 팔았습니다');
  }
}
function placeOrder(side){
  const it=marketOf(S.mitem)||(postOf(S.post)?marketOf(postOf(S.post).mid):null);
  if(!it) return;
  if(orderOf(it.id)) return toast('이미 걸어 둔 주문이 있습니다');
  const q=quoteOf(it);
  const price=parseMkPrice(q);
  const broke=isBroke();
  let cost=0;
  if(side==='buy'){
    if(ownedOf(it.id)) return toast('이미 보유한 물건입니다');
    if((DB.credit||0)<price) return toast('크레딧이 부족합니다');
    DB.credit-=price;
    cost=price;
  }else{
    const own=ownedOf(it.id);
    if(!own) return toast('보유한 물건만 팔 수 있습니다');
    DB.owned=DB.owned.filter(x=>x.mid!==it.id);
    cost=own.cost||0;
  }
  const wait=fillWait(side,price,q);
  if(wait<=0) bump('instant');
  else if(wait>=24*HOUR) bump('hopeless');
  else if(wait>=30*MIN) bump('unfav');
  else bump('wait');
  const o={id:uid(), mid:it.id, side, price, cost:side==='sell'?(cost||0):price, due:Date.now()+wait, fromBroke:!!broke};
  if(wait<=0){ fillOrder(o); }
  else{
    DB.morders.push(o);
    toast('주문을 걸었습니다 · '+waitLabel(wait)+' · 취소 불가');
  }
  cycleMarket();
  S.mkPrice='';
  save(); render();
  checkAchs();
}

function hourBand(){
  const y=Math.max(2026, Math.min(2100, +S.g.yy||campusYear()));
  const m=Math.max(1, Math.min(12, +S.g.mm||1));
  const d=Math.max(1, Math.min(31, +S.g.dd||1));
  let a=Math.max(0, Math.min(23, +S.g.h0||0));
  let b=Math.max(1, Math.min(24, +S.g.h1||6));
  if(b<=a) b=Math.min(24,a+6);
  return {y,m,d,a,b};
}
function campusYear(){
  return worldDate().getFullYear();
}
const SLOTS=[[0,6],[6,12],[12,18],[18,24]];
function slotOfHour(h){
  return SLOTS.find(s=>h>=s[0]&&h<s[1])||SLOTS[0];
}
function tlEq(x,t){ return x.y===t.y&&x.m===t.m&&x.d===t.d&&x.a===t.a&&x.b===t.b; }
function sortTl(){
  DB.tl.sort((a,b)=> (a.y-b.y)||(a.m-b.m)||(a.d-b.d)||(a.a-b.a));
}
function fillDay(y,m,d){
  DB.tl=DB.tl||[];
  SLOTS.forEach(s=>{
    if(!DB.tl.some(x=>x.y===y&&x.m===m&&x.d===d&&x.a===s[0]&&x.b===s[1]))
      DB.tl.push({id:uid(), y, m, d, a:s[0], b:s[1], st:'wait'});
  });
  sortTl();
}
function ensureTl(){
  DB.tl=DB.tl||[];
  if(!DB.tl.length){
    const w=worldDate();
    fillDay(w.getFullYear(), w.getMonth()+1, w.getDate());
  }
}
function pickTl(x){
  if(!x) return;
  S.g.yy=String(x.y); S.g.mm=String(x.m); S.g.dd=String(x.d);
  S.g.h0=String(x.a); S.g.h1=String(x.b);
}
function pickNextTl(){
  ensureTl(); sortTl();
  const n=DB.tl.find(x=>x.st!=='in');
  pickTl(n||DB.tl[DB.tl.length-1]);
}
function markTl(st){
  ensureTl();
  const t=hourBand();
  let x=DB.tl.find(z=>tlEq(z,t));
  if(!x){ x={id:uid(), y:t.y, m:t.m, d:t.d, a:t.a, b:t.b, st:'wait'}; DB.tl.push(x); }
  if(st==='in' || (st==='made' && x.st!=='in')) x.st=st;
  fillDay(x.y, x.m, x.d);
  if(st==='in' && SLOTS.every(s=>DB.tl.some(z=>z.y===x.y&&z.m===x.m&&z.d===x.d&&z.a===s[0]&&z.st==='in'))){
    const dt=new Date(x.y, x.m-1, x.d+1);
    fillDay(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
  }
  sortTl();
}
function markTlFromItems(items){
  (items||[]).forEach(f=>{
    const at=dueOf(f);
    if(at==null) return;
    const dt=new Date(WORLD0+at);
    const s=slotOfHour(dt.getHours());
    const t={y:dt.getFullYear(), m:dt.getMonth()+1, d:dt.getDate(), a:s[0], b:s[1]};
    S.g.yy=String(t.y); S.g.mm=String(t.m); S.g.dd=String(t.d); S.g.h0=String(t.a); S.g.h1=String(t.b);
    markTl('in');
  });
  pickNextTl();
}

function rangeStamp(){

}
function clockStamp(){
  const d=worldDate();
  const days='일월화수목금토';
  const h=d.getHours();
  const ap=h<5?'새벽':h<12?'오전':h<18?'오후':'밤';
  const h12=h%12||12;
  const mm=String(d.getMinutes()).padStart(2,'0');
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+days[d.getDay()]+'요일 '+ap+' '+h12+':'+mm;
}

function todHint(){

function buildAll(){
  const n=+S.g.n||0, qn=+S.g.qn||0, mn=+S.g.mn||0;
  const gT=$('#gT'); if(gT) S.g.topic=gT.value;

  const t=hourBand();
  const when=rangeStamp()+' 글';
  const lo=String(t.a).padStart(2,'0')+':00';
  const hi=t.b>=24?'24:00':(String(t.b).padStart(2,'0')+':00');
  const whenBlock=when+'\n'
    +'이 구간만 다뤄라. '+t.a+'시부터 '+t.b+'시 직전까지. '+todHint()+'\n'
    +'글·댓글·투표·거래는 전부 이 날짜, 이 시간대에 올라온 것처럼 써라.\n'
    +'다른 날짜·구간 밖 이야기는 쓰지 마라.\n'
    +'각 항목에 "date": "'+t.y+'-'+String(t.m).padStart(2,'0')+'-'+String(t.d).padStart(2,'0')+'", "time": "HH:MM" 을 넣어라.\n'
    +'date는 이 날짜 그대로. time은 '+lo+' 이상, '+hi+' 미만. 구간 밖·다른 날짜는 넣지 마라.\n'
    +'글마다 시각을 다르게 흩어라. 제목·본문에 시계 숫자를 박지 말고 생활의 결로 보여라.';

  const imgField=withImg?'\n      "image": "텀블러만 놓인 빈 자리 사진",':'';
  const imgRule=withImg
    ?'\n- image — 실제 사진이 아니라 설명 한 줄이다. 화면에는 "📷 …" 상자로 뜬다.\n  파일 경로나 URL, 확장자를 쓰지 마라. 30자 이내. 게시글의 약 '+imgPct+'%에만 넣어라.'
    : (n>0?'\n- image 필드는 넣지 마라.':'');
  const arcField=withArc?'\n      "arc": "도서관 자리 사건",':'';
  const arcRule=withArc
    ?'\n- arc — 같은 사건을 묶는 이름표다. 게시글·물품·투표에 똑같은 문자열을 붙이면 앱이 이어 보여준다.\n'
     +'  전체를 한 떡밥으로 만들지 마라. 떡밥은 종류를 가리지 않고 나눠 써도 된다 (글↔물품↔투표).\n'
     +'  '+total+'개 중 '+arcN+'개에만 arc를 넣어라 (약 '+aPct+'%. 예: 30개면 5개 안팎).\n'
     +'  떡밥은 한두 갈래만. 예: 분실 글 + "[거래] 에어팟" + "주인 나타났냐" 투표.\n'
     +'  나머지 항목에는 arc 키를 넣지 마라.'
    :'\n- arc 필드는 게시글·물품·투표 어디에도 넣지 마라.';

  let cast='';

    cast='\n\n'+ptpl()
      .split('{명단}').join(personBlock())
      .split('{빈도}').join('전체 글의 약 '+pPct+'%');

  const jobs=[];

  jobs.push(qn?('- 투표 '+qn+'개. 소재 힌트: '+qtopic+'.\n  이미 '+DB.polls.length+'개의 투표가 쌓여 있다. 겹치는 소재는 피해라.'):'- 투표 0개. polls는 []');

      +'나머지는 사건과 무관한 일상. 제목마다 사건 이름을 박지 마라. 짧게 이름표를 쓸 거면 arc로.\n\n';
  }
  S.gen=atpl()
    .split('{시점}').join(whenBlock)
    .split('{떡밥필드}').join(arcField)
    .split('{사진필드}').join(imgField)
    .split('{사진규칙}').join(imgRule)
    .split('{떡밥규칙}').join(arcRule)
    .split('{인물}').join(cast)
    .split('{사건}').join(evBlock)
    .split('{할일}').join(jobs.join('\n'));
  if(S.gen.indexOf(when)<0) S.gen=whenBlock+'\n\n'+S.gen;

  render();

}

function personBlock(){

    const L=[];
    if(pr.age) L.push('  나이: '+pr.age);

function mk(s,k,n){ return (s.marks[k]||0)>=(n||1); }
function tr(s,t){ return s.marks['tr:'+t]||0; }
function achState(){
  const posts=DB.posts||[], people=DB.people||[];
  const m=buildMentions();
  const marks=DB.marks||{};
  let comments=0, picks=0, iMax=0, iSum=0, iN=0;
  posts.forEach(p=>{
    comments+=p.comments.filter(c=>c.by==='me').length;
    picks+=(p.used||[]).length;
  });
  people.forEach(pr=>{
    const v=m.interest[pr.id]||0;
    if(v>0) iN++;
    iSum+=v; if(v>iMax) iMax=v;
  });
  let kinds=0, vibes=0;
  KIND.forEach(k=>{ if(marks['tr:'+k]) kinds++; });
  VIBE.forEach(k=>{ if(marks['tr:'+k]) vibes++; });
  return {
    likes:posts.filter(p=>p.liked).length,
    scraps:posts.filter(p=>p.scrapped).length,
    comments, picks,
    votes:posts.filter(p=>p.myVote!=null).length,
    revealed:posts.length,
    trades:DB.trades||0,
    owned:(DB.owned||[]).length,
    roi:DB.bestRoi||0,
    credit:DB.credit||0,
    iMax, iSum, iN, marks, kinds, vibes,
    allCast:people.length>=3 && iN>=people.length
  };
}
function showNextAch(){
  if(S.sheet) return;
  if(S.view==='lab'||S.view==='stock'||S.view==='more') return;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return;
  if(!(S.achQ||[]).length) return;
  S.sheet={type:'ach', a:S.achQ.shift()};
  render();
}
function checkAchs(){
  if(!DB) return;
  DB.achs=DB.achs||[];
  const st=achState();
  let n=0;
  ACHS.forEach(a=>{
    if(DB.achs.indexOf(a.id)>=0) return;
    if(!a.test(st)) return;
    DB.achs.push(a.id);
    S.achQ=S.achQ||[]; S.achQ.push(a);
    n++;
  });
  if(n){ save(); showNextAch(); }
}

  const have=new Set(DB.achs||[]);

let lastView=null;
function render(){
  if(S.tab==='market'||S.tab==='poll') S.tab='feed';
  if(S.view==='market'||S.view==='poll') S.view='feed';
  const app=$('#app');
  const same=(lastView===S.view);
  const keepTop=same?app.scrollTop:0;
  const ae=document.activeElement;
  const fid=(ae&&ae.id&&app.contains(ae))?ae.id:null;
  const fval=fid?ae.value:null;
  let fsel=null; try{ fsel=fid?ae.selectionStart:null; }catch(e){}

  renderHeader(); renderNav(); renderCover();
  const map={feed:vFeed,poll:vPoll,detail:vDetail,hot:vHot,mine:vMine,people:vPeople,mentions:vMentions,search:vSearch,more:vMore,lab:vLab,stock:vStock,market:vMarket,mitem:vMItem};
  app.innerHTML=(map[S.view]||vFeed)();
  lastView=S.view;
  app.scrollTop=same?keepTop:0;
  if(fid){
    const el=document.getElementById(fid);
    if(el){
      if(fval!=null&&el.value!==fval) el.value=fval;
      try{ el.focus({preventScroll:true}); if(fsel!=null) el.setSelectionRange(fsel,fsel); }catch(e){}
    }
  }
  document.querySelectorAll('.sheet-bg').forEach(n=>n.remove());
  if(S.sheet) renderSheet();
}

function shrinkPhoto(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const S0=200, c=document.createElement('canvas');
      c.width=S0; c.height=S0;
      const side=Math.min(img.width,img.height);
      const sx=(img.width-side)/2, sy=(img.height-side)/2;
      const ctx=c.getContext('2d');
      ctx.drawImage(img,sx,sy,side,side,0,0,S0,S0);
      try{ cb(c.toDataURL('image/jpeg',0.8)); }
      catch(e){ toast('사진을 처리하지 못했습니다'); }
    };
    img.onerror=()=>toast('이미지 파일이 아닙니다');
    img.src=String(rd.result);
  };
  rd.onerror=()=>toast('파일을 읽지 못했습니다');
  rd.readAsDataURL(file);
}
const STOP=['진짜','너무','그냥','우리','오늘','근데','어떻게','이거','저거','그거','하는','있는','없는',

let tkCache={key:'',list:[]};
function trendList(){
  const key=DB.posts.length+':'+DB.posts.reduce((a,p)=>a+p.comments.length,0);
  if(tkCache.key===key) return tkCache.list;
  const cnt={};
  DB.posts.slice(0,25).forEach(p=>{
    const text=p.title+' '+p.body;
    text.split(/[^가-힣A-Za-z0-9]+/).forEach(raw=>{
      let w=raw.trim();
      if(w.length>=3) w=w.replace(/(으로|에서|한테|에게|입니다|이라고|라고|은|는|이|가|을|를|에|의|도|만|과|와|로)$/,'');
      if(w.length<2||w.length>8) return;
      if(/^[A-Za-z]+$/.test(w)&&w.length<3) return;      // vs, ok 같은 짧은 영문 제외
      if(STOP.indexOf(w)>=0) return;
      if(/^[0-9]+$/.test(w)) return;
      cnt[w]=(cnt[w]||0)+1;
    });
  });
  const list=Object.keys(cnt).filter(w=>cnt[w]>=2).sort((a,b)=>cnt[b]-cnt[a]).slice(0,6);
  tkCache={key,list};
  return list;
}

let mcCache={key:'',map:{},posts:{},interest:{}};
function mentionKeys(pr){
  const name=String(pr.name||'').trim();
  if(!name) return [];
  const keys=[name];
  const tok=name.split(/[\s·,]+/).filter(x=>x.length>=2).sort((a,b)=>b.length-a.length)[0];
  if(tok&&tok!==name) keys.push(tok);
  return keys;
}
/* 관심도: 그 인물이 언급된 글에 내가 한 상호작용의 무게 합
   공감 1 · 스크랩 2 · 내 댓글 3 · 투표 1 */
function myWeight(p){
  let w=0;
  if(p.liked) w+=1;
  if(p.scrapped) w+=2;
  if(isPoll(p)&&p.myVote!=null) w+=1;
  w+=p.comments.filter(c=>c.by==='me').length*3;
  return w;
}
function buildMentions(){
  const key=DB.posts.length+':'+DB.posts.reduce((a,p)=>a+p.comments.length+myWeight(p),0)
    +':'+(DB.people||[]).map(p=>p.id+'\t'+p.name).join('|');
  if(mcCache.key===key) return mcCache;
  const map={}, posts={}, interest={}, weighted={};
  DB.people.forEach(pr=>{
    const keys=mentionKeys(pr);
    let n=0, score=0; const list=[];
    DB.posts.forEach((p,i)=>{
      const hay=p.title+'\n'+p.body+'\n'+p.comments.map(c=>c.text).join('\n');
      const hayPost=p.title+'\n'+p.body;
      let hit=0, hitPost=0;
      for(let k=0;k<keys.length;k++){
        let a=0, c=0;
        while((a=hay.indexOf(keys[k],a))>=0){ c++; a+=keys[k].length; }
        if(c){ hit=c; break; }
      }
      for(let k=0;k<keys.length;k++){
        if(hayPost.indexOf(keys[k])>=0){ hitPost=1; break; }
      }
      if(hit){ n+=hit; list.push(p.id); }
      if(i<60){
        const wt=winWeight(i);
        score+=hitPost?wt:-wt*MKT_DECAY;
      }
    });
    map[pr.id]=n; posts[pr.id]=list; weighted[pr.id]=score;
    interest[pr.id]=list.reduce((a,id)=>{ const p=postOf(id); return a+(p?myWeight(p):0); },0);
  });
  mcCache={key,map,posts,interest,weighted};
  return mcCache;
}
function interestOf(pr){ return buildMentions().interest[pr.id]||0; }
function mentionCount(pr){ return buildMentions().map[pr.id]||0; }

function chooseReply(pid,idx){
  const p=postOf(pid); if(!p) return;
  const f=srcOf(p)||{}; const ch=(f.choices||[])[idx]; if(!ch) return;
  if(p.used.indexOf(idx)>=0) return;
  p.used.push(idx);
  if(!p.myNo) p.myNo=nextNo(p);
  const parent=(ch.to!=null && p.cmap[ch.to])?topOf(p,p.cmap[ch.to]):null;
  const myId=uid();
  p.comments.push({id:myId,by:'me',no:p.myNo,text:String(ch.text||''),at:DB.clock,
    likes:0,liked:false,parent});
  payOnce(p,'paidCmt',20); nightBump(); bump('pick');
  const src=srcOf(p)||{};
  if((p.used||[]).length>=(src.choices||[]).length) bump('allpick');
  if(isPoll(p)) bump('pollcmt');
  let t=Date.now();
  const gapS=Math.max(1,DB.cfg.replyDelay)*1000;
  (ch.replies||[]).forEach(r=>{
    t+=gapS+Math.floor(Math.random()*1500);
    DB.pending.push({pid:p.id,parent:myId,text:String(r.text||''),writer:!!r.writer,
      likes:+r.likes||0,due:t});           // parent는 내 댓글 id로 고정된다
  });
  save(); render();
  const m=$('#app'); if(m) m.scrollTop=m.scrollHeight;
  checkAchs();
}
function sendComment(){
  const el=$('#cIn'); if(!el) return;
  const text=el.value.trim(); if(!text) return;
  const p=postOf(S.post); if(!p) return;
  if(!p.myNo) p.myNo=nextNo(p);
  p.comments.push({id:uid(),by:'me',no:p.myNo,text,at:DB.clock,likes:0,liked:false,parent:S.replyTo?topOf(p,S.replyTo):null});
  payOnce(p,'paidCmt',20); nightBump(); bump('typed');
  if(isPoll(p)) bump('pollcmt');
  S.replyTo=null; save(); render();
  const m=$('#app'); if(m) m.scrollTop=m.scrollHeight;
  checkAchs();
}
function tpl(){ return (DB.tpl&&DB.tpl.trim())?DB.tpl:DEFAULT_TPL; }
function ptpl(){ return (DB.ptpl&&DB.ptpl.trim())?DB.ptpl:DEFAULT_PTPL; }
function qtpl(){ return (DB.qtpl&&DB.qtpl.trim())?DB.qtpl:DEFAULT_QTPL; }
function buildPoll(){
  S.gen=qtpl()
    .split('{개수}').join(S.g.qn)
    .split('{주제}').join(String(S.g.qtopic||'').trim()||'대학 생활 전반')
    .split('{누적}').join(DB.polls.length);
  S.fold=S.fold||{}; S.fold.out=1;
  render();
  const o=$('#genOut'); if(o) o.scrollIntoView({block:'center'});
}
function buildPrompt(){
  const n=S.g.n, topic=String(S.g.topic||'').trim(), withArc=S.g.arc!=='0';
  const imgPct=+S.g.imgPct||0, withImg=imgPct>0;
  const pPct=DB.people.length?(+S.g.peoplePct||0):0;

  const imgField=withImg?'\n    "image": "텀블러만 놓인 빈 자리 사진",':'';
  const imgRule=withImg
    ?'\n- image — 실제 사진이 아니라 설명 한 줄이다. 화면에는 "📷 …" 상자로 뜬다.\n  파일 경로나 URL, 확장자를 쓰지 마라. 30자 이내. 전체 글의 약 '+imgPct+'%에만 넣어라.'
    :'\n- image 필드는 넣지 마라.';

  let cast='';
  if(pPct>0){
    const list=DB.people.map(pr=>{
      const L=[];
      if(pr.age) L.push('  나이: '+pr.age);
      const bd=[pr.build,pr.shape].filter(Boolean).join(' · ');
      if(bd) L.push('  체격: '+bd);
      if(pr.look) L.push('  외모: '+pr.look);
      if(pr.chara) L.push('  성격: '+pr.chara);
      if(pr.desc) L.push('  소개: '+pr.desc);
      if(pr.memo) L.push('  메모: '+String(pr.memo).split('\n').join('\n        '));
      return '- '+pr.name+(pr.role?' ('+pr.role+')':'')+'\n'+L.join('\n');
    }).join('\n');
    cast='\n\n'+ptpl()
      .split('{명단}').join(list)
      .split('{빈도}').join('전체 글의 약 '+pPct+'%');
  }

  const arcField=withArc?'\n    "arc": "도서관 자리 사건",':'';
  const arcRule=withArc
    ?'\n- arc — 같은 사건을 다루는 글에 똑같이 붙이는 이름표다. 앱이 이 값으로 글을 묶어 보여준다.\n'
     +'  한두 개 사건을 정하고, 그 사건에 대해 글 2~4개를 시간 순서대로 만들어라.\n'
     +'  제보 → 목격담이나 반론 → 결과 보고 순서가 자연스럽다. 뒤 글은 앞 글을 언급하며 시작해라.\n'
     +'  나머지 글에는 arc를 넣지 마라. 전체의 3분의 1을 넘기지 마라.'
    :'\n- arc 필드는 넣지 마라.';
  S.gen=tpl()
    .split('{떡밥필드}').join(arcField)
    .split('{떡밥규칙}').join(arcRule)
    .split('{개수}').join(n)
    .split('{주제}').join(topic||'대학 생활 전반')
    .split('{누적}').join(DB.feed.length)
    .split('{사진필드}').join(imgField)
    .split('{사진규칙}').join(imgRule)
    .split('{인물}').join(cast);
  S.fold=S.fold||{}; S.fold.out=1;
  render();
  const o=$('#genOut'); if(o) o.scrollIntoView({block:'center'});
}
function copyPrompt(){ copyText(S.gen,'genOut'); }
function copyText(t,elId){
  if(!t) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('복사했습니다'),()=>fallback());
  }else fallback();
  function fallback(){
    const o=$('#'+elId); if(!o) return;
    o.removeAttribute('readonly'); o.select(); o.setSelectionRange(0,999999);
    try{ document.execCommand('copy'); toast('복사했습니다'); }
    catch(e){ toast('길게 눌러 복사해주세요'); }
    o.setAttribute('readonly','readonly');
  }
}
function back(){
  S.replyTo=null;
  if(S.view==='lab'||S.view==='stock') return nav('more');
  nav(['detail','more','mentions','search','mitem'].indexOf(S.view)>=0?(S.tab||'feed'):S.view);
}

document.addEventListener('click',e=>{
  if(!DB) return;
  const t=e.target.closest('[data-tab],[data-act],[data-open],[data-item],[data-like],[data-scrap],[data-clike],[data-reply],[data-choice],[data-cfg],[data-person],[data-vote],[data-gmode],[data-ment],[data-trend],[data-fold],[data-mkcat],[data-slot],[data-tl]');
  if(!t) return;
  const d=t.dataset;
  if(d.tab){
    if(d.tab==='hot') bump('tabh');
    if(d.tab==='people') bump('tabp');
    nav(d.tab,d.tab); checkAchs(); return;
  }
  if(d.open){
    S.post=+d.open; S.replyTo=null;
    const p=postOf(S.post);
    if(p&&isTrade(p)){ S.mitem=p.mid; bump('look'); }
    return nav('detail');
  }
  if(d.mkcat){
    S.mkCat=d.mkcat==='*'?'':d.mkcat;
    return render();
  }
  if(d.slot!=null && d.slot!==''){
    const slots=[[0,6],[6,12],[12,18],[18,24]];
    const s=slots[+d.slot];
    if(s){ S.g.h0=String(s[0]); S.g.h1=String(s[1]); render(); }
    return;
  }
  if(d.tl){
    ensureTl();
    const x=DB.tl.find(z=>String(z.id)===String(d.tl));
    if(x){ pickTl(x); render(); }
    return;
  }
  if(d.item){
    const raw=d.item;
    const id=(raw!=='' && +raw===+raw && String(+raw)===String(raw))?+raw:raw;
    if(String(S.mitem)!==String(id)) S.mkPrice='';
    S.mitem=id; bump('look');
    const p=tradePostOf(id);
    if(p){ S.post=p.id; S.replyTo=null; return nav('detail'); }
    return nav('mitem');
  }
  if(d.choice){ const a=d.choice.split(':'); return chooseReply(+a[0],+a[1]); }
  if(d.vote){
    const a=d.vote.split(':'), p=postOf(+a[0]), i=+a[1];
    if(p&&p.myVote==null&&p.options&&p.options[i]!==undefined){
      p.myVote=i; p.votes[i]=(p.votes[i]||0)+1; creditGain(10); nightBump(); save(); render();
      toast(`'${p.options[i]}'에 투표했습니다`);
      checkAchs();
    }
    return;
  }
  if(d.person){ S.sheet={type:'person',id:+d.person}; S.pd=null; return render(); }
  if(d.ment){ S.ment=+d.ment; return nav('mentions'); }
  if(d.trend){ S.q=d.trend; bump('search'); nav('search'); checkAchs(); return; }
  if(d.like){
    const p=postOf(+d.like); if(!p) return;
    p.liked=!p.liked; p.likes+=p.liked?1:-1;
    if(p.liked){
      payOnce(p,'paidLike',5); nightBump();
      if(p.image) bump('imglike');
      if(isPoll(p)) bump('polllike');
      if(p.arc) bump('arclike');
      if(p.scrapped) bump('both');
    }
    save(); render(); checkAchs(); return;
  }
  if(d.scrap){
    const p=postOf(+d.scrap); if(!p) return;
    p.scrapped=!p.scrapped; p.scraps+=p.scrapped?1:-1;
    if(p.scrapped && p.liked) bump('both');
    save(); render(); checkAchs(); return;
  }
  if(d.clike){ const p=postOf(S.post); if(!p) return;
    const c=p.comments.find(x=>x.id===+d.clike);
    if(c){ c.liked=!c.liked; c.likes+=c.liked?1:-1; save(); } return render(); }
  if(d.reply){ S.replyTo=+d.reply; render(); const i=$('#cIn'); if(i) i.focus(); return; }
  if(d.cfg){ const a=d.cfg.split(':'); DB.cfg[a[0]]=parseFloat(a[1]); save(); tick(); return render(); }
  if(d.gmode){ S.genMode=d.gmode; S.gen=''; return render(); }
  if(d.fold){
    S.fold=S.fold||{};
    S.fold[d.fold]=S.fold[d.fold]?0:1;
    return render();
  }

  switch(d.act){
    case 'back': back(); break;
    case 'go-settings': nav('more'); break;
    case 'go-lab': pickNextTl(); nav('lab'); break;
    case 'tl-add': tlAdd(); break;
    case 'go-stock': nav('stock'); break;
    case 'enter': enterCampus(); break;
    case 'leave': leaveCampus(); break;
    case 'mk-buy': placeOrder('buy'); break;
    case 'mk-sell': placeOrder('sell'); break;
    case 'mk-down': {
      const it=marketOf(S.mitem); if(!it) break;
      if(ownedOf(it.id)||orderOf(it.id)){ toast('거래 중인 물건은 내릴 수 없습니다'); break; }
      it.down=1;
      DB.listed=(DB.listed||[]).filter(id=>String(id)!==String(it.id));
      save(); render(); toast('매물을 내렸습니다'); break; }
    case 'mk-up': {
      const it=marketOf(S.mitem); if(!it) break;
      it.down=0; cycleMarket(); save(); render(); toast('매물을 다시 올렸습니다'); break; }
    case 'archive': archiveBoard(); break;
    case 'send': sendComment(); break;
    case 'add-person': S.sheet={type:'person',id:0}; S.pd=null; render(); break;
    case 'photo-pick': grabPerson(); $('#pfile').click(); break;
    case 'photo-clear': grabPerson(); S.pd.photo=''; render(); toast('사진을 제거했습니다'); break;
    case 'save-person': {
      const nm=$('#prName').value.trim(); if(!nm) return toast('이름을 입력하세요');
      const g=id=>{ const el=$('#'+id); return el?String(el.value||'').trim():''; };
      const cur0=S.sheet.id?DB.people.find(x=>x.id===S.sheet.id):null;
      const photo=(S.pd&&S.pd.photo!==undefined)?S.pd.photo:((cur0&&cur0.photo)||'');
      const data={name:nm,role:g('prRole')||'기타',age:g('prAge'),build:g('prBuild'),
        shape:g('prShape'),memo:g('prMemo'),photo:photo};
      const cur=S.sheet.id?DB.people.find(x=>x.id===S.sheet.id):null;
      if(cur) Object.assign(cur,data);
      else { DB.people.push(Object.assign({id:uid()},data)); bump('person'); }
      S.sheet=null; S.pd=null; S.view='people'; S.tab='people';
      mcCache.key=''; save(); render();
      toast(cur?'수정했습니다':'인물을 추가했습니다'); checkAchs(); break; }
    case 'del-person': DB.people=DB.people.filter(x=>x.id!==S.sheet.id);
      S.sheet=null; S.pd=null; mcCache.key=''; save(); render(); toast('삭제했습니다'); break;
    case 'close-sheet': S.sheet=null; S.pd=null; showNextAch(); if(!S.sheet) render(); break;
    case 'tod': DB.cfg.tod=(DB.cfg.tod===false); save(); tick(); render();
      toast(DB.cfg.tod?'시간대에 따라 속도가 달라집니다':'시간대 반영을 껐습니다'); break;
    case 'skip': skipNext(); break;
    case 'pull-load': bump('pull'); pullLoad(); checkAchs(); break;
    case 'src-toggle': S.srcOpen=!S.srcOpen; render(); break;
    case 'pick-file': S.fileMode='feed'; $('#file').click(); break;
    case 'backup-save': bump('backup'); downloadBackup(); checkAchs(); break;
    case 'backup-load': S.fileMode='backup'; $('#file').click(); break;
    case 'backup-text': S.backupText=S.backupText?'':exportAll(); render(); break;
    case 'backup-copy': copyText(S.backupText,'bkBox'); break;
    case 'people-add': {
      const el=$('#ppaste'); const v=el?el.value:'';
      if(!v.trim()) return toast('붙여넣은 내용이 없습니다');
      S.ppaste=''; mergePeople(v); break; }
    case 'people-copy': {
      S.ppaste=JSON.stringify(DB.people.map(pr=>{
        const o={}; ['name','role','age','build','shape','desc','memo','photo'].forEach(k=>{ if(pr[k]) o[k]=pr[k]; });
        return o; }), null, 1);
      render(); copyText(S.ppaste,'ppaste'); break; }
    case 'add-paste': {
      const el=$('#paste'); const v=el?el.value:'';
      if(!v.trim()) return toast('붙여넣은 내용이 없습니다');
      S.pasted=''; addFeed(v,'붙여넣기'); break; }
    case 'gen':
    case 'gen-poll':
    case 'gen-market': buildAll(); break;
    case 'atpl-toggle': S.atplEdit=!S.atplEdit; if(!S.atplEdit) S.atplDraft=null; render(); break;
    case 'atpl-save': {
      const el=$('#atplBox'); const v=el?el.value:'';
      if(!v.trim()) return toast('내용이 비어 있습니다');
      DB.atpl=v; S.atplDraft=null; save(); render(); toast('통합 프롬프트를 저장했습니다'); break; }
    case 'atpl-reset': DB.atpl=null; S.atplDraft=null; save(); render(); toast('기본값으로 되돌렸습니다'); break;
    case 'mtpl-toggle': S.mtplEdit=!S.mtplEdit; if(!S.mtplEdit) S.mtplDraft=null; render(); break;
    case 'mtpl-save': {
      const el=$('#mtplBox'); const v=el?el.value:'';
      if(!v.trim()) return toast('내용이 비어 있습니다');
      DB.mtpl=v; S.mtplDraft=null; save(); render(); toast('물품 프롬프트를 저장했습니다'); break; }
    case 'mtpl-reset': DB.mtpl=null; S.mtplDraft=null; save(); render(); toast('기본값으로 되돌렸습니다'); break;
    case 'toggle-arc': S.g.arc=(S.g.arc==='0'?'1':'0'); render(); break;
    case 'toggle-ev': S.g.evOn=(S.g.evOn==='1'?'0':'1'); render(); break;
    case 'qtpl-toggle': S.qtplEdit=!S.qtplEdit; if(!S.qtplEdit) S.qtplDraft=null; render(); break;
    case 'qtpl-save': {
      const el=$('#qtplBox'); const v=el?el.value:'';
      if(!v.trim()) return toast('내용이 비어 있습니다');
      DB.qtpl=v; S.qtplDraft=null; save(); render(); toast('투표 프롬프트를 저장했습니다'); break; }
    case 'qtpl-reset': DB.qtpl=null; S.qtplDraft=null; save(); render(); toast('기본값으로 되돌렸습니다'); break;
    case 'tpl-toggle': S.tplEdit=!S.tplEdit; if(!S.tplEdit) S.tplDraft=null; render(); break;
    case 'tpl-save': {
      const el=$('#tplBox'); const v=el?el.value:'';
      if(!v.trim()) return toast('내용이 비어 있습니다');
      DB.tpl=v; S.tplDraft=null; save(); render(); toast('기본 프롬프트를 저장했습니다'); break; }
    case 'tpl-reset': DB.tpl=null; S.tplDraft=null; save(); render(); toast('기본값으로 되돌렸습니다'); break;
    case 'ptpl-toggle': S.ptplEdit=!S.ptplEdit; if(!S.ptplEdit) S.ptplDraft=null; render(); break;
    case 'ptpl-save': {
      const el=$('#ptplBox'); const v=el?el.value:'';
      if(!v.trim()) return toast('내용이 비어 있습니다');

    case 'persist':
      if(navigator.storage&&navigator.storage.persist){
        navigator.storage.persist().then(ok=>{
          toast(ok?'저장 공간이 보호됩니다':'브라우저가 요청을 받아들이지 않았습니다');
          checkQuota();
        });
      }else toast('이 브라우저는 지원하지 않습니다');
      break;
    case 'copy': copyPrompt(); break;
    case 'reset': S.sheet={type:'reset'}; render(); break;
    case 'reset-sample': S.sheet={type:'reset-sample'}; render(); break;
    case 'reset-sample-yes': S.sheet=null; resetSamplePosts(); break;
    case 'reset-yes': {
      try{ localStorage.removeItem(KEY); }catch(err){}
      if(idb) idbSet(KEY,null);
      DB=fresh(); S.sheet=null; S.view='feed'; S.tab='feed'; S.mitem=null; S.gen=''; S.pasted=''; S.tplEdit=false; S.tplDraft=null; S.ptplEdit=false; S.ptplDraft=null; S.qtplEdit=false; S.qtplDraft=null; S.mtplEdit=false; S.mtplDraft=null; S.atplEdit=false; S.atplDraft=null;
      flush(); tick(); render(); checkQuota(); toast('처음 상태로 돌아갔습니다'); break; }
  }
});
const GMAP={gT:'topic',qT:'qtopic',mT:'mtopic'};
function onSlide(e,done){
  const id=e.target.id;
  if(!id||id.indexOf('sl-')!==0) return false;
  const key=id.slice(3), d=SLD[key];
  if(!d) return true;
  const raw=+e.target.value;
  const val=d.list?d.list[Math.max(0,Math.min(d.list.length-1,raw))]:raw;
  if(CFG_SLD[key]){
    DB.cfg[key]=val;
    const lb=document.getElementById('sv-'+key);
    if(lb) lb.textContent=d.fmt(val);
    if(done){
      let ch=false;
      if(key==='mLo') ch=cycleMarket();
      save(); tick();
      if(ch) redraw();
    }
    return true;
  }
  S.g[key]=String(val);
  const lb=document.getElementById('sv-'+key);
  if(lb) lb.textContent=d.fmt(val);
  if(done){ save(); tick(); }
  return true;
}
function keepInput(e){
  if(onSlide(e,false)) return;
  const id=e.target.id;
  if(id==='paste') S.pasted=e.target.value;
  else if(id==='tplBox') S.tplDraft=e.target.value;
  else if(id==='ptplBox') S.ptplDraft=e.target.value;
  else if(id==='qtplBox') S.qtplDraft=e.target.value;
  else if(id==='mtplBox') S.mtplDraft=e.target.value;
  else if(id==='atplBox') S.atplDraft=e.target.value;
  else if(id==='evBox') S.g.ev=e.target.value;
  else if(id==='mkPrice') S.mkPrice=e.target.value;
  else if(id==='ppaste') S.ppaste=e.target.value;
  else if(GMAP[id]) S.g[GMAP[id]]=e.target.value;
  else if(id&&id.indexOf('pr')===0&&S.sheet&&S.sheet.type==='person'){
    S.pd=S.pd||{}; S.pd[id]=e.target.value;
  }
}
document.addEventListener('input',keepInput);
document.addEventListener('change',e=>{ if(onSlide(e,true)) return; keepInput(e); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.id!=='cIn') return;
  if(e.isComposing||e.keyCode===229) return;
  e.preventDefault();
  sendComment();
});
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(S.dirty&&!busy()) redraw(); },120); });
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const mode=S.fileMode||'feed';
  const r=new FileReader();
  r.onload=()=>{
    const txt=String(r.result);
    if(mode==='backup'||txt.indexOf('"__campustime"')>=0) restoreBackup(txt);
    else addFeed(txt,f.name);
  };
  r.onerror=()=>toast('파일을 읽지 못했습니다');
  r.readAsText(f,'utf-8');
  e.target.value='';
});
$('#pfile').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  if(!/^image\//.test(f.type)) return toast('이미지 파일을 선택하세요');
  shrinkPhoto(f,url=>{ S.pd=S.pd||{}; S.pd.photo=url; render(); toast('사진을 넣었습니다'); });
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) flush();
  else if(S.playing){ tick(); pulse(); }
});
window.addEventListener('pagehide',flush);

/* ===================== 시작 ===================== */
openIDB().then(db=>{ idb=db; return loadAll(); }).then(d=>{
  DB=d||fresh();
  DB.lastTick=Date.now();
  S.playing=false; S.cover='in';
  refreshQuotes();
  try{ render(); }catch(e){}
  setInterval(tick,3000);
  setInterval(pulse,1000);
  setInterval(rotateTick,4000);
  checkQuota();
}).catch(()=>{
  if(!DB||!valid(DB)) DB=fresh();
  DB.lastTick=Date.now();
  S.playing=false; S.cover='in';
  try{ refreshQuotes(); render(); }catch(e){}
  setInterval(tick,3000); setInterval(pulse,1000);
});
